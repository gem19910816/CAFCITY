# ===========================================================================
# CAF失落城市自定义城市附属
# 构建约定沿用 mod制作\ 下其他 CAF 附属: 版本号 = major.minor.构建号(自动递增)
# ===========================================================================

# --- Gradle 自身 ---
# 注意: 这里【不要】写 org.gradle.jvmargs。指定 jvmargs 会让 Gradle 去 fork 一个
# 单次 daemon 进程, 在本机沙箱环境下会失败("A problem occurred starting process
# 'Gradle build daemon'")。内存改用环境变量 GRADLE_OPTS 传给构建进程(见 build.bat)。
org.gradle.daemon=false
# 使用 Java toolchain 版本，让 Gradle 从本机环境或已安装的 toolchain 中选择 JDK。

# --- Minecraft / NeoForge ---
minecraft_version=1.21.1
neo_version=21.1.252
# 玩家可用的版本区间 (写进 neoforge.mods.toml)
minecraft_version_range=[1.21.1,1.21.2)
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- 模组信息 ---
mod_id=caf_lc_customcity
mod_name=CAF Lost Cities Custom City Addon
mod_name_cn=CAF失落城市自定义城市附属
mod_version=1.0
mod_group=com.caf.lccustomcity
mod_authors=CAF
mod_license=MIT
mod_description=Adds a config folder where you drop whole building files; they are converted on startup into Lost Cities assets and become the ONLY buildings that generate in cities. Chinese name: CAF失落城市自定义城市附属.

# --- 要覆盖的失落城市版本 (用于 neoforge.mods.toml 的依赖声明) ---
lostcities_modid=lostcities
lostcities_version_range=[1.0,)
