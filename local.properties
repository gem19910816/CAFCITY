# 本机路径配置 —— 换电脑 / 换实例时只需要改这个文件
# 编译需要的 Minecraft + NeoForge 类库目录(通常就是 .minecraft\libraries)
minecraft_libraries=E:/Minecraft/PCL2/.minecraft/libraries

# 构建完成后自动把 jar 复制到这个目录(留空则不复制)
deploy_mods=E:/Minecraft/PCL2/.minecraft/versions/失落城市测试/mods

# JDK 21 的位置(留空则用系统 JAVA_HOME)
java_home=E:/Minecraft/jave/jdk-21_windows-x64_bin/jdk-21.0.3
